# Target Path in Repo: .github/workflows/xbox-uwp-appx.yml
# Builds the Eglantine NX2 Xbox Dev Mode UWP (.appx / .msix) package on a Windows runner in GitHub Actions.

name: Build Eglantine NX2 Xbox UWP Appx

on:
  push:
    branches: [ "nx2", "main", "master" ]
  pull_request:
    branches: [ "nx2" ]
  workflow_dispatch:

jobs:
  build-xbox-appx:
    name: Compile Xbox Dev Mode UWP Package (x64)
    runs-on: windows-2022
    steps:
      - name: Checkout Eglantine (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Setup Visual Studio C++ & Windows 10/11 UWP SDK
        shell: pwsh
        run: |
          Write-Host "Configuring build environment for Xbox UWP..."

      - name: Generate Self-Signed Test Certificate for Sideloading
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src\xbox\Cert
          $cert = New-SelfSignedCertificate -Type Custom `
            -Subject "CN=EglantineDev" `
            -KeyUsage DigitalSignature `
            -FriendlyName "Eglantine Xbox Dev Certificate" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          
          $pwd = ConvertTo-SecureString -String "EglantineXbox123!" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "src\xbox\Cert\EglantineXbox.pfx" -Password $pwd
          Export-Certificate -Cert $cert -FilePath "src\xbox\Cert\EglantineXbox.cer"
          Write-Host "Created self-signed test certificate for Xbox Dev Mode."

      - name: Compile and Package UWP Appx
        shell: pwsh
        run: |
          # Build via MSBuild targeting UWP x64
          if (Test-Path "src\xbox\EglantineXbox.vcxproj") {
            msbuild src\xbox\EglantineXbox.vcxproj `
              /p:Configuration=Release `
              /p:Platform=x64 `
              /p:AppxPackageDir="..\..\build\xbox_appx\" `
              /p:AppxBundle=Never `
              /p:UapAppxPackageBuildMode=SideLoadingOnly `
              /p:PackageCertificateKeyFile="Cert\EglantineXbox.pfx" `
              /p:PackageCertificatePassword="EglantineXbox123!"
          } else {
            Write-Host "Compiling CMake Core & Packaging Appx..."
            cmake -B build_xbox -S . -G "Visual Studio 17 2022" -A x64 -DCMAKE_SYSTEM_NAME=WindowsStore -DCMAKE_SYSTEM_VERSION=10.0.19041.0
            cmake --build build_xbox --config Release
          }

      - name: Upload Xbox Dev Mode UWP Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eglantine-NX2-Xbox-DevMode-Appx
          path: |
            build\xbox_appx\**\*.appx
            build\xbox_appx\**\*.msix
            src\xbox\Cert\*.cer
          if-no-files-found: warn
