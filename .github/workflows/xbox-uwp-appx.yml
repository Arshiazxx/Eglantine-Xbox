# Target Path in Repo: .github/workflows/xbox-uwp-appx.yml
# Self-contained GitHub Actions workflow that installs glslangValidator, compiles Eglantine NX2 (x64),
# and packages + signs the Xbox Developer Mode (.appx) bundle.

name: Build Eglantine NX2 Xbox UWP Appx

on:
  push:
    branches: [ "nx2", "main", "master" ]
  pull_request:
    branches: [ "nx2" ]
  workflow_dispatch:

jobs:
  build-xbox-appx:
    name: Compile Xbox Dev Mode UWP Package (x64)
    runs-on: windows-2022
    steps:
      - name: Checkout Eglantine (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSBuild & Windows SDK Tools
        uses: microsoft/setup-msbuild@v2

      - name: Install glslangValidator (Khronos Official Binary)
        shell: pwsh
        run: |
          $glslangDir = "$env:RUNNER_TEMP\glslang"
          New-Item -ItemType Directory -Force -Path $glslangDir | Out-Null
          $zipPath = "$glslangDir\glslang.zip"

          Write-Host "Downloading official Khronos glslangValidator for Windows x64..."
          try {
            Invoke-WebRequest -Uri "https://github.com/KhronosGroup/glslang/releases/download/main-tot/glslang-master-windows-x64-Release.zip" -OutFile $zipPath -UseBasicParsing
          } catch {
            Write-Host "Fallback: querying latest KhronosGroup/glslang release via GitHub API..."
            $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/KhronosGroup/glslang/releases" -Headers @{ "User-Agent" = "GitHubActions" }
            $asset = $releases | ForEach-Object { $_.assets } | Where-Object { $_.name -match "windows.*Release\.zip$" } | Select-Object -First 1
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zipPath -UseBasicParsing
          }

          Expand-Archive -Path $zipPath -DestinationPath $glslangDir -Force
          $validatorExe = (Get-ChildItem -Path $glslangDir -Filter "glslangValidator.exe" -Recurse | Select-Object -First 1).FullName
          if (-not $validatorExe) {
            Write-Error "Failed to locate glslangValidator.exe after extraction!"
            exit 1
          }

          $binDir = Split-Path -Parent $validatorExe
          Add-Content -Path $env:GITHUB_PATH -Value $binDir
          Write-Host "GLSLANG_VALIDATOR_PATH=$validatorExe" >> $env:GITHUB_ENV
          Write-Host "Installed glslangValidator at: $validatorExe"
          & $validatorExe --version

      - name: Generate Self-Signed Test Certificate for Sideloading
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src\xbox\Cert | Out-Null
          $cert = New-SelfSignedCertificate -Type Custom `
            -Subject "CN=EglantineDev" `
            -KeyUsage DigitalSignature `
            -FriendlyName "Eglantine Xbox Dev Certificate" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          
          $pwd = ConvertTo-SecureString -String "EglantineXbox123!" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "src\xbox\Cert\EglantineXbox.pfx" -Password $pwd | Out-Null
          Export-Certificate -Cert $cert -FilePath "src\xbox\Cert\EglantineXbox.cer" | Out-Null
          Write-Host "Created self-signed test certificate for Xbox Dev Mode."

      - name: Configure CMake for Headless Core (MSVC x64)
        shell: pwsh
        run: |
          $glslangForward = $env:GLSLANG_VALIDATOR_PATH -replace '\\', '/'
          cmake -B build -S . -G "Visual Studio 17 2022" -A x64 `
            "-DGLSLANG_VALIDATOR=$glslangForward" `
            -DENABLE_QT=0 `
            -DENABLE_SDL2=0 `
            -DENABLE_WEB_SERVICE=0 `
            -DYUZU_TESTS=0 `
            -DYUZU_USE_BUNDLED_VCPKG=0

      - name: Compile NX2 Core and CLI Executable
        shell: pwsh
        run: |
          cmake --build build --config Release --target yuzu-cmd --parallel

      - name: Package Appx for Xbox Developer Mode
        shell: pwsh
        run: |
          # 1. Locate the compiled executable
          $exe = Get-ChildItem -Path build\bin\Release -Filter "*.exe" -Recurse | Select-Object -First 1
          if (-not $exe) {
            Write-Error "Could not find compiled executable in build\bin\Release"
            exit 1
          }
          $exeName = $exe.Name
          Write-Host "Found compiled executable: $exeName"

          # 2. Prepare Appx Layout directory
          $layoutDir = "build\appx_layout"
          New-Item -ItemType Directory -Force -Path "$layoutDir\Assets" | Out-Null
          Copy-Item -Path "$($exe.DirectoryName)\*" -Destination $layoutDir -Recurse -Force

          # 3. Create placeholder PNG assets if missing
          Add-Type -AssemblyName System.Drawing
          $assetSizes = @{
            "StoreLogo.png" = @(50, 50);
            "Square150x150Logo.png" = @(150, 150);
            "Square44x44Logo.png" = @(44, 44);
            "Wide310x150Logo.png" = @(310, 150);
            "SplashScreen.png" = @(620, 300)
          }

          foreach ($item in $assetSizes.GetEnumerator()) {
            $dest = "$layoutDir\Assets\$($item.Key)"
            if (-not (Test-Path $dest)) {
              $bmp = New-Object System.Drawing.Bitmap $item.Value[0], $item.Value[1]
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              $brush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(16, 20, 24))
              $g.FillRectangle($brush, 0, 0, $item.Value[0], $item.Value[1])
              $bmp.Save($dest, [System.Drawing.Imaging.ImageFormat]::Png)
              $g.Dispose()
              $bmp.Dispose()
            }
          }

          # 4. Write AppxManifest.xml (using indented YAML-safe lines)
          $manifestLines = @(
            '<?xml version="1.0" encoding="utf-8"?>',
            '<Package',
            '  xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10"',
            '  xmlns:mp="http://schemas.microsoft.com/appx/2014/phone/manifest"',
            '  xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10"',
            '  xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities"',
            '  IgnorableNamespaces="uap mp rescap">',
            '  <Identity Name="Eglantine.NX2.Xbox" Publisher="CN=EglantineDev" Version="1.0.0.0" ProcessorArchitecture="x64" />',
            '  <mp:PhoneIdentity PhoneProductId="a842b109-17d4-4a25-9a84-2e2e7cb41f19" PhonePublisherId="00000000-0000-0000-0000-000000000000"/>',
            '  <Properties>',
            '    <DisplayName>Eglantine NX2 Xbox Runner</DisplayName>',
            '    <PublisherDisplayName>Eglantine Development Team</PublisherDisplayName>',
            '    <Logo>Assets\StoreLogo.png</Logo>',
            '    <Description>Experimental Nintendo Switch 2 (NX2) loose ExeFS kernel boot runner for Xbox Developer Mode.</Description>',
            '  </Properties>',
            '  <Dependencies>',
            '    <TargetDeviceFamily Name="Windows.Xbox" MinVersion="10.0.19041.0" MaxVersionTested="10.0.22621.0" />',
            '    <TargetDeviceFamily Name="Windows.Universal" MinVersion="10.0.19041.0" MaxVersionTested="10.0.22621.0" />',
            '  </Dependencies>',
            '  <Resources>',
            '    <Resource Language="x-generate"/>',
            '  </Resources>',
            '  <Applications>',
            "    <Application Id=`"App`" Executable=`"$exeName`" EntryPoint=`"Windows.FullTrustApplication`">",
            '      <uap:VisualElements',
            '        DisplayName="Eglantine NX2 Runner"',
            '        Square150x150Logo="Assets\Square150x150Logo.png"',
            '        Square44x44Logo="Assets\Square44x44Logo.png"',
            '        Description="Eglantine NX2 Xbox Runner"',
            '        BackgroundColor="#0A0D10">',
            '        <uap:DefaultTile Wide310x150Logo="Assets\Wide310x150Logo.png" />',
            '        <uap:SplashScreen Image="Assets\SplashScreen.png" BackgroundColor="#0A0D10" />',
            '      </uap:VisualElements>',
            '    </Application>',
            '  </Applications>',
            '  <Capabilities>',
            '    <Capability Name="internetClient" />',
            '    <Capability Name="internetClientServer" />',
            '    <Capability Name="privateNetworkClientServer" />',
            '    <rescap:Capability Name="codeGeneration" />',
            '    <rescap:Capability Name="broadFileSystemAccess" />',
            '  </Capabilities>',
            '</Package>'
          )
          Set-Content -Path "$layoutDir\AppxManifest.xml" -Value ($manifestLines -join "`r`n") -Encoding Utf8

          # 5. Locate MakeAppx and SignTool in Windows SDK
          $makeAppx = (Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter "MakeAppx.exe" -Recurse | Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1).FullName
          $signTool = (Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter "SignTool.exe" -Recurse | Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1).FullName

          Write-Host "Using MakeAppx: $makeAppx"
          Write-Host "Using SignTool: $signTool"

          New-Item -ItemType Directory -Force -Path "build\xbox_appx" | Out-Null
          $outputAppx = "build\xbox_appx\Eglantine.NX2.Xbox_1.0.0.0_x64.appx"

          # 6. Pack Appx
          & $makeAppx pack /d $layoutDir /p $outputAppx /nv /o
          if ($LASTEXITCODE -ne 0) {
            Write-Error "MakeAppx packaging failed."
            exit $LASTEXITCODE
          }

          # 7. Sign Appx
          & $signTool sign /fd SHA256 /a /f "src\xbox\Cert\EglantineXbox.pfx" /p "EglantineXbox123!" $outputAppx
          if ($LASTEXITCODE -ne 0) {
            Write-Error "SignTool signing failed."
            exit $LASTEXITCODE
          }
          Write-Host "Successfully built and signed Xbox Dev Mode Appx package!"

      - name: Upload Xbox Dev Mode UWP Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eglantine-NX2-Xbox-DevMode-Appx
          path: |
            build\xbox_appx\*.appx
            src\xbox\Cert\*.cer
          if-no-files-found: error
